/* ---------- TRACKING (plug GA4 / Meta / TikTok / Google Ads) ---------- */
function track(name,p={}){
  const d=Object.assign({region:state.region,variant_headline:CONFIG.headline,variant_cta:CONFIG.cta},p);
  try{(window.dataLayer=window.dataLayer||[]).push(Object.assign({event:name},d));
    if(window.gtag)gtag("event",name,d);
    if(window.fbq)fbq("trackCustom",name,d);
    if(window.ttq)ttq.track(name,d);
    if(name==="waitlist_submitted"){ if(window.fbq)fbq("track","Lead",d); if(window.ttq)ttq.track("SubmitForm",d);
      /* Google Ads: gtag('event','conversion',{send_to:'AW-XXXX/YYYY'}) */ }
  }catch(e){}
}

/* ---------- REGION ---------- */
const state={region:"CA"};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function detect(){
  try{const s=localStorage.getItem("vt_region");if(s)return s;}catch(e){}
  const q=new URLSearchParams(location.search).get("region");if(q&&/^(BR|CA)$/i.test(q))return q.toUpperCase();
  const l=(navigator.language||"").toLowerCase(),tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
  if(l.startsWith("pt")||/Sao_Paulo|Bahia|Fortaleza|Manaus|Recife|Belem|Cuiaba|Campo_Grande/.test(tz))return "BR";
  return "CA";
}
function apply(r,manual){
  state.region=r;const T=r==="BR"?pt:en,L=r==="BR"?"pt":"en";
  document.documentElement.lang=r==="BR"?"pt-BR":"en-CA";
  $$("[data-t]").forEach(e=>{const k=e.dataset.t;e.textContent=k==="cta"?CTA[CONFIG.cta][L]:k==="cta3"?T.cta3:(T[k]||"")});
  $("[data-hl]").innerHTML=HL[CONFIG.headline];
  $("#metaDesc").content=T.meta;$("#langLbl").textContent=T.lang;
  $("#regional").querySelector("[data-t=rC]").classList.toggle("hide",!T.rC);
  $("select[name=country]").value=r;
  $("#wa").placeholder=r==="BR"?"+55 11 91234-5678":"+1 604 555 0123";
  $$(".rs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===r));
  try{localStorage.setItem("vt_region",r)}catch(e){}
  if(manual)track("region_selected",{region_source:"manual"});
}
$$(".rs button").forEach(b=>b.onclick=()=>apply(b.dataset.r,true));
apply(detect(),false);
track("page_view",{region_source:"auto"});

/* ---------- CTA + FORM ---------- */
$$("[data-cta]").forEach(a=>a.addEventListener("click",()=>track("cta_clicked",{cta_id:a.dataset.cta})));
const f=$("#wf");let started=false;
f.addEventListener("input",()=>{if(!started){started=true;track("waitlist_started")}});
f.addEventListener("submit",async e=>{
  e.preventDefault();const d=Object.fromEntries(new FormData(f)),T=state.region==="BR"?pt:en;
  if(!d.name.trim()){$("#err").textContent=T.eN;return}
  if(!/^\S+@\S+\.\S+$/.test(d.email)){$("#err").textContent=T.eE;return}
  const wd=(d.whatsapp||"").replace(/\D/g,"");
  if(wd.length<10||wd.length>15){$("#err").textContent=T.eW;return}
  $("#err").textContent="";
  const lead={whatsapp:d.whatsapp.trim(),name:d.name.trim(),email:d.email.trim(),country:d.country,lead_region:state.region,ts:Date.now()};
  let ok=false,why="";try{const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({access_key:W3F_KEY,subject:"Vancouteen waitlist ("+d.country+")",from_name:"Vancouteen",name:lead.name,email:lead.email,whatsapp:lead.whatsapp,country:lead.country,lead_region:lead.lead_region,variant_headline:CONFIG.headline,variant_cta:CONFIG.cta,page:location.href})});let j={};try{j=await r.json()}catch(x){}ok=r.ok&&j.success!==false;why=j.message||("HTTP "+r.status)}catch(e){why="rede/bloqueio: "+e.message}
  if(!ok){$("#err").textContent=T.eS+" ("+why+")";return}
  try{const a=JSON.parse(localStorage.getItem("vt_leads")||"[]");a.push(lead);localStorage.setItem("vt_leads",JSON.stringify(a))}catch(e){}
  track("waitlist_submitted",{lead_country:d.country,lead_region:state.region});
  $("#modal").classList.add("on");$("#close").focus();f.reset();$("select[name=country]").value=state.region;started=false;
});
$("#close").onclick=()=>$("#modal").classList.remove("on");

$$('a[data-go]').forEach(a=>a.addEventListener("click",e=>{

  t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"});
}));

/* ---------- MOTION ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
$$(".rv").forEach(e=>io.observe(e));
const st=$("#sticky"),hero=$(".hero"),fm=$("#waitlist");let vis={h:true,f:false};
new IntersectionObserver(es=>es.forEach(e=>{vis[e.target===hero?"h":"f"]=e.isIntersecting;st.classList.toggle("on",!vis.h&&!vis.f)})).observe(hero);
new IntersectionObserver(es=>es.forEach(e=>{vis.f=e.isIntersecting;st.classList.toggle("on",!vis.h&&!vis.f)})).observe(fm);
const px=$("#parallax");let tk=false;
addEventListener("scroll",()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{px.style.transform="translateY("+Math.min(scrollY*.12,80)+"px)";tk=false})},{passive:true});
</script>
